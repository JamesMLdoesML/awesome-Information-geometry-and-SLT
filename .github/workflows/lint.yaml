name: lint
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install awesome_bot
        run: gem install awesome_bot
      - name: Check links in readme.md
        # 403/429 are tolerated: publishers (Wiley, Elsevier, MIT Press, ResearchGate, Amazon)
        # block CI bots or rate-limit even though the links work in a browser.
        run: >
          awesome_bot readme.md
          --allow-redirect
          --allow-dupe
          --allow-ssl
          --allow 403,429,503
          --request-delay 1
          --white-list researchgate.net,direct.mit.edu,doi.org/10.1162,onlinelibrary.wiley.com,linkinghub.elsevier.com,link.springer.com,doi.org/10.1007,doi.org/10.1002,sciencedirect.com,amazon.com,awesome.re,creativecommons.org,web.archive.org
